<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kütüphanem</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .book-list { list-style-type: none; padding: 0; }
        .book-item { background: #ecf0f1; margin-bottom: 10px; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Dijital Kütüphanem</h1>
        <ul class="book-list">
            <li class="book-item">
                <span><strong>1984</strong> - George Orwell</span>
                <span>Okundu ✅</span>
            </li>
            <li class="book-item">
                <span><strong>Suç ve Ceza</strong> - Dostoyevski</span>
                <span>Okunuyor ⏳</span>
            </li>
        </ul>
    </div>
</body>
</html>
